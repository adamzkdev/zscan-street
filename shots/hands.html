<!doctype html><html><head><meta charset="UTF-8"><title>hands test</title>
<style>html,body{margin:0;height:100%;overflow:hidden;font:11px monospace}#l{position:absolute;inset:0;pointer-events:none}#l div{position:absolute;transform:translateX(-50%);color:#444;white-space:nowrap}</style></head>
<body><canvas id="c" style="width:100%;height:100%;display:block"></canvas><div id="l"></div>
<script type="module">
import * as THREE from "three";
import { Snark, loadArt } from "/src/scene/snark.ts";
const q = new URLSearchParams(location.search);
const night = q.has("night");
const zoom = Number(q.get("zoom") ?? 1);
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: false });
r.setSize(W, H, false);
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(night ? "#10121c" : "#b8c4d4");
document.querySelectorAll("#l").forEach((e) => (e.style.color = night ? "#aaa" : "#333"));
// what each one holds: [label, setup(s)]
const U = "#e8453c";
const all = {
  free: (s) => {},
  shielded: (s) => s.setTxs([{ kind: "shielded" }]),
  two: (s) => s.setTxs([{ kind: "transparent" }, { kind: "shielding" }]),
  migration: (s) => s.setTxs([{ kind: "migration" }]),
  deshield: (s) => s.setTxs([{ kind: "deshielding" }]),
  briefcase: (s) => ((s.carry = "briefcase"), s.redrawHold()),
  goldcase: (s) => ((s.carry = "goldcase"), s.redrawHold()),
  coffee: (s) => ((s.carry = "coffee"), s.redrawHold()),
  can: (s) => ((s.carry = "can"), s.redrawHold()),
  bag: (s) => ((s.carry = "bag"), s.redrawHold()),
  phone: (s) => ((s.carry = "phone"), s.redrawHold()),
  flowers: (s) => ((s.carry = "flowers"), s.redrawHold()),
  fish: (s) => ((s.carry = "fish"), s.redrawHold()),
  basket: (s) => ((s.carry = "basket"), s.redrawHold()),
  rod: (s) => ((s.carry = "rod"), s.redrawHold()),
  book: (s) => ((s.carry = "book"), s.redrawHold()),
  umbrella: (s) => s.setUmbrella(U),
  "umb-bag": (s) => ((s.carry = "bag"), s.redrawHold(), s.setUmbrella("#3a7ad8")),
  "umb-coffee": (s) => ((s.carry = "coffee"), s.redrawHold(), s.setUmbrella("#f4b728")),
  "umb-phone": (s) => ((s.carry = "phone"), s.redrawHold(), s.setUmbrella("#2aa86a")),
  "umb-box": (s) => (s.setTxs([{ kind: "shielded" }]), s.setUmbrella(U)),
  seated: (s) => ((s.carry = "coffee"), s.redrawHold(), s.sit(true)),
  perched: (s) => ((s.carry = "can"), s.redrawHold(), s.perch(0.6)),
  strap: (s) => ((s.bus = {}), (s.state = "riding"), s.sit(false)),
  "cap": (s) => s.setCap(),
};
const names = (q.get("set") ?? Object.keys(all).join(",")).split(",");
const ids = [42, 777, 1500, 3333, 512, 2048, 6000, 8888, 11, 7890, 9012, 1, 5000, 3456];
const cols = Number(q.get("cols") ?? 9);
const sp = 1.9 * zoom;
// rows: for each name, facing right and left (and walking frames when ?walk)
const walk = q.has("walk");
const variants = walk ? [["R", 1, 0.0], ["R", 1, 1.6], ["R", 1, 4.7], ["L", -1, 1.6], ["L", -1, 4.7]] : [["R", 1, null], ["L", -1, null]];
const cells = [];
for (const n of names) for (const v of variants) cells.push([n, ...v]);
const rows = Math.ceil(cells.length / cols);
const cam = new THREE.OrthographicCamera(0, cols * sp, 0, -rows * 3.0 * zoom, -50, 50);
cam.position.set(-sp * 0.5, 0, 10);
cam.updateProjectionMatrix();
cam.updateMatrixWorld();
const aspect = W / H;
// fit
const ww = cols * sp, hh = rows * 3.0 * zoom;
let vw = ww, vh = hh;
if (vw / vh < aspect) vw = vh * aspect; else vh = vw / aspect;
cam.left = 0; cam.right = vw; cam.top = 0.1; cam.bottom = -vh + 0.1; cam.updateProjectionMatrix();
cam.position.set(-0.5 * sp + 0.2, 0, 10);
const snarks = [];
const lab = document.getElementById("l");
for (let i = 0; i < cells.length; i++) {
  const [n, fl, f, ph] = cells[i];
  const id = ids[i % ids.length];
  const s = new Snark(id, await loadArt(id));
  const x = (i % cols) * sp, y = -Math.floor(i / cols) * 3.0 * zoom - 2.65 * zoom;
  s.root.position.set(x, y, 0);
  s.root.scale.setScalar(zoom);
  const g = new THREE.Mesh(new THREE.PlaneGeometry(sp * 0.95, 0.06), new THREE.MeshBasicMaterial({ color: night ? "#333848" : "#7a8494" }));
  g.position.set(x + 0.15, y - 0.03, -1);
  scene.add(g);
  scene.add(s.root);
  all[n](s);
  s.showParcels?.(true);
  if (ph !== null) {
    s.walk([new THREE.Vector3(x + f * 1000, y, 0)], 0.00001);
    s.phase = ph;
  } else s.faceDir = new THREE.Vector3(f, 0, 0);
  snarks.push([s, ph]);
  const d = document.createElement("div");
  d.textContent = `${n} ${fl}${ph !== null && ph !== undefined ? " " + ph : ""}`;
  lab.appendChild(d);
  const pv = new THREE.Vector3(x + 0.15, y - 0.08, 0).project(cam);
  d.style.left = ((pv.x + 1) / 2) * W + "px";
  d.style.top = ((1 - pv.y) / 2) * H + "px";
}
const camQuat = new THREE.Quaternion(), camRight = new THREE.Vector3(1, 0, 0);
for (const [s, ph] of snarks) {
  s.update(0.0001, 1, camQuat, camRight);
  if (ph !== null) { s.phase = ph; s.update(0.0, 1, camQuat, camRight); }
}
r.render(scene, cam);
window.handsReady = true;
</script></body></html>
